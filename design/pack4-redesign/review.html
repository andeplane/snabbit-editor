<!doctype html><html lang="en"><meta charset="utf-8"><title>Pack 4 · ImageGen-first redesign</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#101820;color:#e3edec;font:14px system-ui}header{display:flex;gap:14px;align-items:center}header img{width:62px;height:62px}h1{font-size:24px;margin:0 0 6px}p{color:#a7bec0;margin:4px 0}.modes{display:flex;gap:10px;margin:16px 0}button{cursor:pointer;background:#20383e;color:#c5deda;border:1px solid #49666a;padding:9px 16px;border-radius:6px}button[aria-pressed=true]{background:#5d4775;border-color:#ac90c8;color:white}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}article{padding:11px;border:1px solid #3d4c58;border-radius:9px;background:#1a2631;min-width:0}h2{font-size:14px;min-height:36px;margin:0;color:#e6d3f8}.picture{width:100%;height:390px;background:#101720;border-radius:5px;display:block;object-fit:contain}canvas{display:none!important}body.game canvas{display:block!important}body.game img.picture{display:none}article p{font-size:12px;min-height:45px;line-height:1.5;margin-top:10px}small{color:#aacfaa;font-size:11px}footer{color:#9db3b8;font-size:12px;margin-top:16px}a{color:#c9b3e0}</style><header><img src="/redesign/purple-card.png" alt="Selected purple Pack4 card"><div><h1>A Little Push · a fresh visual start</h1><p>Five separate ImageGen designs, translated by five subagents into playable levels.</p></div></header><div class="modes"><button id="concept" aria-pressed="true">ImageGen concepts</button><button id="game" aria-pressed="false">Actual game renderer</button><a href="/">Open editor ↗</a></div><div class="cards"></div><footer>Original pack openings studied · no repeated full-width strips · three stars and zero-damage solutions verified · purple card selected</footer><script type="module">
import {createEditorStore} from '/src/store/editorStore.ts';import {renderGrid} from '/src/canvas/HexGridRenderer.ts';import {preloadSprites} from '/src/canvas/sprites.ts';
const levels=await(await fetch('/redesigned-pack4.json')).json();await preloadSprites();const notes=['One lever, a crescent-shaped opening, and an upper star cove.','Two quiet shores; local switches open pockets with stars.','Airy asteroid coves combine blinking blocks and switches.','Unequal hollow chambers; each of five levers opens the next passage.','Two facing crescents, two levers, and an optional diamond nook.'];
for(const [i,level] of levels.entries()){
const el=document.createElement('article');const title=document.createElement('h2');title.textContent=`${i+1}. ${level.name}`;el.append(title);const img=document.createElement('img');img.className='picture';img.src=`/redesign/level-${i+1}/concept.png`;img.alt=`ImageGen design for ${level.name}`;el.append(img);const canvas=document.createElement('canvas');canvas.className='picture';el.append(canvas);const note=document.createElement('p');note.textContent=notes[i];el.append(note);const stat=document.createElement('small');stat.textContent='3 stars · zero damage · A* optimal';el.append(stat);document.querySelector('.cards').append(el);
const store=createEditorStore({storage:{read:()=>null,write:()=>{}},newId:()=>"preview",schedule:()=>0,cancel:()=>{}});store.getState().loadLevel(level,'40',false);const state=store.getState();const cw=el.clientWidth-22,ch=390,dpr=devicePixelRatio||1;canvas.width=cw*dpr;canvas.height=ch*dpr;const zoom=Math.min((cw-24)/(state.width*32+32),(ch-24)/(state.height*16+32));const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);renderGrid(ctx,{...state,zoom,scrollX:0,scrollY:-(ch-(state.height*16+32)*zoom)/(2*zoom),showGrid:false,timingView:'layout',route:null},cw,ch,[],2000);
}
function mode(game){document.body.classList.toggle('game',game);document.getElementById('game').setAttribute('aria-pressed',String(game));document.getElementById('concept').setAttribute('aria-pressed',String(!game))}document.getElementById('game').onclick=()=>mode(true);document.getElementById('concept').onclick=()=>mode(false);
</script></html>
